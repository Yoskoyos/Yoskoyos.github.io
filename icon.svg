    <rect x="300" y="166" width="10" height="96" fill="#b7c1d2" opacity=".6"/>
    <rect x="104" y="162" width="64" height="104" rx="22" fill="#1a2332"/>
    <circle cx="136" cy="214" r="34" fill="#0a0d14"/>
    <circle cx="136" cy="214" r="27" fill="none" stroke="#00d9ff" stroke-width="7"/>
    <circle cx="136" cy="214" r="13" fill="#00d9ff"/>
    <circle cx="129" cy="207" r="5" fill="#ffffff" opacity=".85"/>
    <circle cx="340" cy="190" r="9" fill="#ef4444"/>
