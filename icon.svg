      <stop offset="0" stop-color="#7d889c"/><stop offset="1" stop-color="#a3adbf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(6 24)">
  <!-- suport de perete -->
  <rect x="362" y="262" width="50" height="118" rx="12" fill="url(#metal)"/>
  <circle cx="387" cy="290" r="5" fill="#5d687c"/><circle cx="387" cy="352" r="5" fill="#5d687c"/>
  <path d="M370 322 L318 262" stroke="url(#metal)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="314" cy="256" r="22" fill="#8c97ab"/>
  <circle cx="314" cy="256" r="9" fill="#6b768a"/>

  <!-- corpul camerei, înclinat spre stânga-jos -->
